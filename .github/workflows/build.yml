name: Build
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: tokenflash
          MYSQL_ROOT_PASSWORD: ci-local
          MYSQL_ROOT_HOST: "%"
        ports: ["3306:3306"]
        options: --health-cmd="mysql --protocol=tcp -h 127.0.0.1 -u root -pci-local tokenflash -e 'SELECT 1'" --health-interval=5s --health-timeout=3s --health-retries=30
      redis:
        image: redis:7
        ports: ["6379:6379"]
      kafka:
        image: apache/kafka:3.9.1
        ports: ["9092:9092"]
    env:
      MYSQL_PASSWORD: ci-local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Initialize test schema and topic
        env:
          MYSQL_PWD: ci-local
        run: |
          for script in schema token-packs token-pack-demo; do
            mysql -h 127.0.0.1 -u root tokenflash < "src/main/resources/db/$script.sql"
          done
          docker exec "${{ job.services.kafka.id }}" /opt/kafka/bin/kafka-topics.sh \
            --bootstrap-server localhost:9092 --create --if-not-exists \
            --topic seckill-voucher-order --partitions 1 --replication-factor 1
      - name: Test and package
        run: mvn -B clean verify
