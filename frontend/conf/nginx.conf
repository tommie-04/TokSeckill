worker_processes 1;
events { worker_connections 1024; }
http {
    include mime.types;
    default_type application/octet-stream;
    server {
        listen 8080;
        server_name localhost;
        location / { root html/tokenflash; index index.html; }
        location /api/ { proxy_pass http://127.0.0.1:8081/; }
    }
}
